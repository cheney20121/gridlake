name: 功能建议
description: 新功能或改进想法
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: 提交前请看一下 ROADMAP.md，也许已经在计划中。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 你现在是怎么做的，哪里不方便
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 希望功能怎么工作；有参考产品或截图可以附上
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: contribute
    attributes:
      label: 你愿意参与实现吗
      options: ["愿意提 PR", "可以帮忙测试", "只是提建议"]
