name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（单元 + 端到端）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ledger-server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ledger-server
      - name: 单元测试
        run: cargo test --locked
      - name: 端到端测试
        run: tests/e2e/run.sh

  frontend:
    name: 前端（检查 + 单元 + 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-web-vue3
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: demo-web-vue3/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: 类型检查
        run: pnpm exec vue-tsc --noEmit -p tsconfig.app.json
      - name: 单元测试
        run: pnpm test:unit
      - name: 构建
        run: pnpm build

  ui:
    name: 界面测试（Chrome）
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ledger-server
      - name: 编译后端
        working-directory: ledger-server
        run: cargo build --locked
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: demo-web-vue3/pnpm-lock.yaml
      - name: 安装前端依赖
        working-directory: demo-web-vue3
        run: pnpm install --frozen-lockfile
      - name: 界面测试
        working-directory: demo-web-vue3
        env:
          LEDGER_BIN: ../ledger-server/target/debug/ledger-server
          CHROME_BIN: /usr/bin/google-chrome
        run: pnpm test:ui
      - name: 失败截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: demo-web-vue3/tests/ui/.artifacts/
