name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forbidden:
    name: 敏感内容检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 检查文件与提交说明
        env:
          # 敏感词清单放在仓库 Secret 里（每行一个正则）；来自 fork 的 PR 拿不到 Secret，只做通用检查
          FORBIDDEN_PATTERNS: ${{ secrets.FORBIDDEN_PATTERNS }}
        run: scripts/check-forbidden.sh
      - name: 版本号一致性（后端与前端）
        run: scripts/check-version.sh
      - name: 接口文档是最新的（docs/api.md 与 docs/openapi.json 由源码生成）
        run: python3 -I scripts/gen-api-docs.py --check
      - name: 错误信息都有英文（server/src/msg_en.json）
        run: python3 -I scripts/extract-messages.py
      - name: 环境变量都写进了部署手册（示例配置里的名字都真实存在）
        run: python3 -I scripts/check-env-docs.py
      - name: 工作流文件语法（actionlint）
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

  licenses:
    name: 第三方许可证检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: 依赖的许可证都在允许清单里（后端 + 前端）
        run: python3 -I scripts/gen-third-party.py --check
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: server/Cargo.toml
          command: check licenses sources

  backend:
    name: 后端（单元 + 端到端）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Clippy（警告视为错误）
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: 单元测试
        run: cargo test --locked
      - name: 端到端测试
        run: tests/e2e/run.sh

  backend-macos:
    name: 后端（macOS 单元测试）
    runs-on: macos-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: 单元测试
        # macOS 上编译内置的 DuckDB 需要显式指定 C++ 标准库头文件目录
        run: |
          sdk="$(xcrun --show-sdk-path)"
          export CXXFLAGS="-isystem ${sdk}/usr/include/c++/v1"
          cargo test --locked

  frontend:
    name: 前端（检查 + 单元 + 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: 类型检查
        run: pnpm exec vue-tsc --noEmit -p tsconfig.app.json
      - name: 国际化检查（t() 用到的键都有英文）
        run: pnpm i18n:check
      - name: 单元测试
        run: pnpm test:unit
      - name: 构建
        run: pnpm build

  ui:
    name: 界面测试（Chrome）
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: 编译后端
        working-directory: server
        run: cargo build --locked
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 安装前端依赖
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: 界面测试
        working-directory: web
        env:
          LEDGER_BIN: ../server/target/debug/gridlake
          CHROME_BIN: /usr/bin/google-chrome
        run: pnpm test:ui
      - name: 失败截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: web/tests/ui/.artifacts/
