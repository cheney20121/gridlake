name: Release

# 推送形如 v0.1.0 的标签时：构建三个平台的安装包并发布 GitHub Release，同时把多架构 Docker 镜像推到 GHCR
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  version:
    name: 校验版本号
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 标签、Cargo.toml 与 package.json 的版本必须一致
        run: scripts/check-version.sh "${GITHUB_REF_NAME#v}"

  binaries:
    name: 安装包（${{ matrix.name }}）
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 用较旧的系统构建，生成的二进制能在更多 Linux 发行版上运行（glibc 向下兼容）
          - { name: linux-x86_64, os: ubuntu-22.04 }
          - { name: linux-aarch64, os: ubuntu-22.04-arm }
          - { name: macos-arm64, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: 构建安装包
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            sdk="$(xcrun --show-sdk-path)"
            export CXXFLAGS="-isystem ${sdk}/usr/include/c++/v1"
          fi
          ./deploy/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  docker:
    name: 镜像（${{ matrix.platform }}）
    needs: version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, os: ubuntu-22.04 }
          - { platform: linux/arm64, os: ubuntu-22.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并按摘要推送（两个架构分别构建，下一个任务合并成一个多架构标签）
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: 记录摘要
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.os }}
          path: /tmp/digests/*
          if-no-files-found: error

  docker-manifest:
    name: 镜像（合并多架构标签）
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: 创建多架构标签
        working-directory: /tmp/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          refs=()
          for digest in *; do refs+=("${{ env.IMAGE }}@sha256:${digest}"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"

  release:
    name: 发布 GitHub Release
    needs: [binaries, docker-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: package-*
          merge-multiple: true
      - name: 汇总校验和
        run: cd assets && cat ./*.sha256 > SHA256SUMS && ls -l
      - name: 从 CHANGELOG 取本版说明
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "详见 CHANGELOG.md" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: assets/*
          prerelease: ${{ contains(github.ref_name, '-') }}
